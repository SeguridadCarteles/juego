function beep(f,d=.1,type='square',v=.06,slide=0){
 if(S.muted)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

const MUSIC={want:null,cur:null,step:0,next:0,timer:null,gain:null,noise:null};
function audioCtx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function musicLevel(){return S.musicOn?(S.musicVol/100)*.55:0}
function musicSetGain(){if(MUSIC.gain&&AC)MUSIC.gain.gain.setTargetAtTime(musicLevel(),AC.currentTime,.05)}
function musicInit(){
 const ac=audioCtx();if(!ac||MUSIC.gain)return !!ac;
 MUSIC.gain=ac.createGain();MUSIC.gain.gain.value=musicLevel();MUSIC.gain.connect(ac.destination);
 const len=ac.sampleRate*.3,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;MUSIC.noise=buf;
 return true;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function chordNotes([r,q]){return [r,r+(q==='m'?3:4),r+7,r+12]}
function note(type,freq,time,dur,vol){
 const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;
 g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(vol,time+.01);g.gain.setTargetAtTime(0,time+dur*.7,dur*.25);
 o.connect(g).connect(MUSIC.gain);o.start(time);o.stop(time+dur+.2);
}
function drum(kind,time){
 const ac=AC;
 if(kind==='k'){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,time);o.frequency.exponentialRampToValueAtTime(40,time+.14);
  g.gain.setValueAtTime(.5,time);g.gain.exponentialRampToValueAtTime(.001,time+.16);o.connect(g).connect(MUSIC.gain);o.start(time);o.stop(time+.2);return}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=MUSIC.noise;f.type='highpass';f.frequency.value=kind==='s'?1500:7000;
 const d=kind==='s'?.12:.03;g.gain.setValueAtTime(kind==='s'?.22:.08,time);g.gain.exponentialRampToValueAtTime(.001,time+d);
 s.connect(f).connect(g).connect(MUSIC.gain);s.start(time);s.stop(time+d+.02);
}
function parseT(str){return str.trim().split(/\s+/)}
function scheduleStep(tr,step,time){
 const sd=60/tr.bpm/4,bar=Math.floor(step/16)%tr.chords.length,i=step%16,ch=chordNotes(tr.chords[bar]);
 const tpl=parseT((Math.floor(step/16)%2)?tr.B:tr.A),tok=tpl[i];
 if(tok!=='.'&&tok!=='-'){let len=1;while(i+len<16&&tpl[i+len]==='-')len++;note(tr.lead,mtof(ch[+tok]+12),time,sd*len*.95,.07)}
 const bt=parseT(tr.bassT),b=bt[i];
 if(b!=='.'&&b!=='-'){let len=1;while(i+len<16&&bt[i+len]==='-')len++;note(tr.bass,mtof(ch[+b]-24),time,sd*len*.9,tr.bass==='sawtooth'?.06:.13)}
 const dr=parseT(tr.drums)[i];if(dr==='k'||dr==='s'||dr==='h')drum(dr,time);
}
function musicTick(){
 if(!AC||!MUSIC.gain)return;
 if(MUSIC.want!==MUSIC.cur){MUSIC.cur=MUSIC.want;MUSIC.step=0;MUSIC.next=AC.currentTime+.08}
 const tr=TRACKS[MUSIC.cur];if(!tr)return;
 if(MUSIC.next<AC.currentTime)MUSIC.next=AC.currentTime+.05;
 while(MUSIC.next<AC.currentTime+.2){
  if(S.musicOn&&S.musicVol>0)scheduleStep(tr,MUSIC.step,MUSIC.next);
  MUSIC.next+=60/tr.bpm/4;MUSIC.step=(MUSIC.step+1)%(16*tr.chords.length);
 }
}
function musicPlay(name){
 MUSIC.want=name;
 if(AC&&MUSIC.gain&&!MUSIC.timer)MUSIC.timer=setInterval(musicTick,40);
}
function musicUnlock(){if(!musicInit())return;if(!MUSIC.timer)MUSIC.timer=setInterval(musicTick,40)}

 L.plats.forEach(([a,b,r])=>{for(let c=a;c<=b;c++)g[r][c]=2});
 const ents={haz:[],drops:[],spawners:[],bolts:[],signs:[],enemies:[],boots:[],start:{x:2*T,y:7*T},goal:null};
 L.items.split(' ').forEach((tok,n)=>{
  const t=tok[0],[cs,rs]=tok.slice(1).split(','),c=+cs,r=rs===undefined?8:+rs,x=c*T,y=r*T;
  if(t==='P')ents.start={x:x+8,y:y-10};
  else if(t==='S')ents.bolts.push({x:x+T/2,y:y+T/2,got:false});
  else if(t==='B')ents.boots.push({x:x+T/2,y:y+T/2,got:false});

 });
 ents.haz.forEach(h=>{

 });
 const spans=L.plats.map(([a,b,r])=>({a,b,r,legs:g[9][a]===1&&g[9][b]===1}));
 return {g,ents,spans};
}

 /* ---------- colisiones ---------- */
 const cell=(c,r)=>(r<0||r>=ROWS||c<0||c>=L.w)?0:g[r][c];
 const overlap=(a,b)=>a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1];
 function moveX(o){
  o.x+=o.vx;
  const minX=isBoss?camX:0;
  if(o.x<minX){o.x=minX;o.vx=0}
  if(o.x+o.w>L.w*T){o.x=L.w*T-o.w;o.vx=0}
  const r1=Math.floor(o.y/T),r2=Math.floor((o.y+o.h-1)/T);
  for(let r=r1;r<=r2;r++){
   if(o.vx>0&&cell(Math.floor((o.x+o.w)/T),r)===1){o.x=Math.floor((o.x+o.w)/T)*T-o.w-.01;o.vx=0;return true}
   if(o.vx<0&&cell(Math.floor(o.x/T),r)===1){o.x=(Math.floor(o.x/T)+1)*T+.01;o.vx=0;return true}
  }return false;
 }
 function moveY(o){
  const prevBottom=o.y+o.h;o.y+=o.vy;o.on=false;
  const c1=Math.floor((o.x+2)/T),c2=Math.floor((o.x+o.w-3)/T);
  if(o.vy>=0){const r=Math.floor((o.y+o.h)/T);
   for(let c=c1;c<=c2;c++){const v=cell(c,r);if(v===1||(v===2&&prevBottom<=r*T+2)){o.y=r*T-o.h;o.vy=0;o.on=true;return}}
  }else{const r=Math.floor(o.y/T);for(let c=c1;c<=c2;c++)if(cell(c,r)===1){o.y=(r+1)*T;o.vy=0;return}}
 }
 const solidAt=(x,y)=>{const v=cell(Math.floor(x/T),Math.floor(y/T));return v===1||v===2};
 const poof=(x,y,col='#ffd400')=>{for(let i=0;i<8;i++)poofs.push({x,y,vx:Math.cos(i*.785)*3,vy:Math.sin(i*.785)*3,l:22,col})};

 const ALIAS={plug:'E',whip:'C',fire:'R',body:'Z',tail:'K',cable:'V',rayo:'U',lluvia:'L',wave:'W'};
 function lessonReel(cvs,types,ui){
  const rc=cvs.getContext('2d'),W=760,HH=H,FR=210;let f=0,idx=0,raf2=0,doneAll=false;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  function fit(){const w=cvs.clientWidth||600;cvs.width=Math.round(w*dpr);cvs.height=Math.round(w*HH/W*dpr)}
  fit();
  const hx=440,fy=GROUND;
  function fake(type){
   const k=ALIAS[type]||type,base={t:k,x:hx,y:8*T,c:9,off:0};
   if(k==='H'||k==='D'||k==='K')base.y=7*T;
   if(k==='V')base.y=0;
   if(k==='Y')base.top=7*T+24;
   if(k==='U')base.off=105;if(k==='N')base.off=70;if(k==='O')base.off=60;
   return base;
  }
  function frame(){
   if(!document.body.contains(cvs)){cancelAnimationFrame(raf2);return}
   const sv={ctx,camX,viewW,t,safe};ctx=rc;camX=0;viewW=W;safe=0;
   const s=cvs.width/W;rc.setTransform(s,0,0,s,0,0);
   if(doneAll){t=f;background();rc.fillStyle=GR[0];rc.fillRect(0,fy,W,HH-fy);line([0,fy,W,fy],INK,4);
    rc.fillStyle='rgba(19,32,63,.35)';rc.fillRect(0,0,W,HH);
    drawHero(rc,W/2,fy-10,{face:1,t:f,wave:true});
    rc.font='64px Bangers, Impact, sans-serif';rc.textAlign='center';rc.lineWidth=10;rc.lineJoin='round';rc.strokeStyle=INK;rc.strokeText('¡REPASO COMPLETO!',W/2,170);rc.fillStyle='#ffd400';rc.fillText('¡REPASO COMPLETO!',W/2,170);
    for(let i=0;i<5;i++){const a=f*.03+i*1.256;rc.font='40px serif';rc.fillText('⭐',W/2+Math.cos(a)*230,250+Math.sin(a)*40)}
    Object.assign({},sv);ctx=sv.ctx;camX=sv.camX;viewW=sv.viewW;t=sv.t;safe=sv.safe;f++;raf2=requestAnimationFrame(frame);return}
   const type=types[idx],k=ALIAS[type]||type,hz=fake(type);t=f;
   background();rc.fillStyle=GR[0];rc.fillRect(0,fy,W,HH-fy);rc.fillStyle=GR[1];rc.fillRect(0,fy+T,W,HH-fy-T);line([0,fy,W,fy],INK,4);
   /* peligro */
   const pulse=f>=50&&f<120?1+Math.sin(f*.5)*.06:1;
   rc.save();rc.translate(hx+24,fy);rc.scale(pulse,pulse);rc.translate(-(hx+24),-fy);
   if(k==='Z')enemy({x:hx+8,y:fy-36,w:32,h:36,vx:-1});
   else if(k==='G')mower({x:hx,y:fy-30,w:44,h:30,vx:-1});
   else if(k==='L'||k==='X'){spawner({t:k,x:hx,cx:hx+24,oy:k==='L'?122:136,off:0,period:110});const yy=(k==='L'?122:136)+((f*4)%(fy-140));spark(hx+24,yy,.9)}
   else{if(k==='Y'){rr(hx-30,7*T,T+60,14,4,'#fff')}hazard(hz)}
   rc.restore();
   if(f>=50&&f<125){rc.strokeStyle=`rgba(232,50,43,${.5+.3*Math.sin(f*.4)})`;rc.lineWidth=5;rc.beginPath();rc.ellipse(hx+24,fy-50,70,70,0,0,7);rc.stroke()}
   /* héroe */
   let px=f<50?90+f*3.4:f<80?260:f<115?260-(f-80)*1.4:211;
   const walking=f<50||(f>=80&&f<115);
   drawHero(rc,px,fy,{face:f>=80&&f<115?1:1,sw:walking?Math.sin(f*.5)*9:0,on:true,t:f,wave:f>=150});
   if(f>=50&&f<120){rc.font='46px Bangers, Impact, sans-serif';rc.textAlign='center';rc.lineWidth=6;rc.strokeStyle=INK;rc.strokeText('!',px,fy-100+Math.sin(f*.4)*3);rc.fillStyle='#e8322b';rc.fillText('!',px,fy-100+Math.sin(f*.4)*3)}
   /* sello NO SE TOCA */
   if(f>=80&&f<150){const a=Math.min(1,(f-80)/8),sc=1.6-.6*a;rc.save();rc.globalAlpha=a;rc.translate(hx+24,fy-60);rc.rotate(-.18);rc.scale(sc,sc);
    rc.strokeStyle='#e8322b';rc.lineWidth=10;rc.beginPath();rc.arc(0,0,62,0,7);rc.stroke();rc.beginPath();rc.moveTo(-44,-44);rc.lineTo(44,44);rc.stroke();

   if(f>=150){const a=Math.min(1,(f-150)/10),sc=.5+.5*a+Math.sin(f*.2)*.03;rc.save();rc.translate(W-90,110);rc.scale(sc,sc);circ(0,0,46,'#22a95a',INK,5);
    rc.fillStyle='#fff';rc.font='60px Bangers, Impact, sans-serif';rc.textAlign='center';rc.fillText('✔',0,22);rc.restore()}
   if(f===150)SFX.sign();

   rc.font='34px Bangers, Impact, sans-serif';rc.textAlign='center';rc.lineWidth=7;rc.lineJoin='round';rc.strokeStyle='#fff';rc.strokeText(title,W/2,48);rc.fillStyle='#e8322b';rc.fillText(title,W/2,48);
   if(f>=110){const a=Math.min(1,(f-110)/12),txt=SLOGAN[type]||(L.msgs[type]||['',''])[1];rc.globalAlpha=a;rc.font='bold 24px Nunito, sans-serif';

   /* barra de avance */
   rc.fillStyle='rgba(19,32,63,.25)';rc.fillRect(0,HH-6,W,6);rc.fillStyle='#ffd400';rc.fillRect(0,HH-6,W*((idx+f/FR)/types.length),6);
   ctx=sv.ctx;camX=sv.camX;viewW=sv.viewW;t=sv.t;safe=sv.safe;
   f++;if(f>=FR){f=0;idx++;if(idx>=types.length){doneAll=true;ui.done()}else ui.step(idx)}

  }

 function physics(){
  const k=P.keys,acc=P.on?PHY.acc:PHY.airAcc;

 function rr(x,y,w,h,r,fill,stroke=INK,lw=3){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2)));else ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}

 function line(pts,col=INK,lw=3){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke()}
 function spark(x,y,s=1){const k=1+.25*Math.sin(t*.4+x);ctx.save();ctx.translate(x,y);ctx.scale(s*k,s*k);ctx.rotate(t*.05);
  ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?5:13;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();
  ctx.fillStyle='#ffd400';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#e8322b';ctx.stroke();ctx.restore()}
 function bolt(x,y,s=1,fill='#ffd400'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
  ctx.moveTo(4,-16);ctx.lineTo(-10,3);ctx.lineTo(-1,3);ctx.lineTo(-5,16);ctx.lineTo(10,-4);ctx.lineTo(1,-4);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();ctx.restore()}
 function repeatLayer(par,period,fn){const off=camX*par;for(let i=Math.floor(off/period)-1;i<=Math.floor((off+viewW)/period)+1;i++)fn(i*period+camX-off,i)}

 const GR={sala:['#c98b4f','#a8703d'],cocina:['#e0b080','#b88655'],bano:['#9ed3e0','#6fb3c4'],calle:['#d9dde6','#5a5f8a'],patio:['#7ed37e','#a8703d'],parque:['#7ed37e','#a8703d'],colegio:['#d9c9a8','#a8906a'],tormenta:['#5a6b7a','#3b4066'],subestacion:['#b8b8b0','#7a7a72']}[L.theme];
 function tiles(){
  const c1=Math.max(0,Math.floor(camX/T)),c2=Math.min(L.w-1,Math.ceil((camX+viewW)/T));
  for(let r=9;r<ROWS;r++)for(let c=c1;c<=c2;c++){
   if(g[r][c]!==1)continue;const x=c*T,y=r*T;
   ctx.fillStyle=r===9?GR[0]:GR[1];ctx.fillRect(x,y,T,T);
   if(r===9){
    if(L.theme==='calle'){ctx.fillStyle='#7ed37e';ctx.fillRect(x,y,T,7)}
    else if(L.theme==='patio'||L.theme==='parque'){ctx.fillStyle='#22a95a';for(let k=0;k<4;k++){ctx.beginPath();ctx.moveTo(x+4+k*12,y+2);ctx.lineTo(x+8+k*12,y-6);ctx.lineTo(x+12+k*12,y+2);ctx.fill()}}
    else if(L.theme==='cocina'||L.theme==='bano'){line([x,y+T/2,x+T,y+T/2],'rgba(19,32,63,.18)',2);line([x+T,y,x+T,y+T],'rgba(19,32,63,.18)',2)}
    else line([x+(c%2?12:30),y+6,x+(c%2?12:30),y+T],'rgba(19,32,63,.25)',1.5);
    line([x,y+1.5,x+T,y+1.5],INK,3);
   }
   if(cell(c-1,r)===0)line([x+1.5,y,x+1.5,y+T],INK,3);
   if(cell(c+1,r)===0)line([x+T-1.5,y,x+T-1.5,y+T],INK,3);

 }

  spans.forEach(s=>{

             bano:{top:'#fff',front:'#9ed3e0',leg:'#9aa3b5'},calle:{top:'#e0a83a',front:'#a8703d',leg:'#7a5a3a'},

 function hazard(h){
  if(hazard2(h)||hazard3(h))return;
  const {x,y}=h,ph=phase(h,t);
  if(h.t==='C'){
   line([x-6,y+T-6,x+8,y+T-20,x+22,y+T-12],INK,6);line([x+30,y+T-14,x+42,y+T-4,x+T+6,y+T-6],INK,6);
   line([x+22,y+T-12,x+30,y+T-20],'#e07b1a',3);line([x+22,y+T-12,x+31,y+T-10],'#e07b1a',3);spark(x+26,y+T-18,.9);
  }else if(h.t==='W'){
   ctx.fillStyle='#4fb3e8';ctx.beginPath();ctx.ellipse(x+T/2,y+T-6,T/2+4,9,0,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
   if((t+x)%40<26){spark(x+12,y+T-16,.6);spark(x+36,y+T-12,.5)}
  }else if(h.t==='E'){
   rr(x+18,y+20,12,T-20,2,'#9aa3b5');rr(x+8,y+4,T-16,34,5,'#fff');
   if(h.capped){rr(x+12,y+8,T-24,26,4,'#22a95a');ctx.fillStyle='#fff';ctx.font='18px Bangers, Impact, sans-serif';ctx.textAlign='center';ctx.fillText('✔',x+T/2,y+28)}
   else{rr(x+16,y+14,4,10,1,INK,null);rr(x+T-20,y+14,4,10,1,INK,null);spark(x+10,y+6,.8);spark(x+T-10,y+10,.6)}
  }else if(h.t==='R'){
   rr(x+2,y+T-16,T-4,14,4,'#fff');
   ['#e8322b','#22a95a','#1aa3e8','#ffd400'].forEach((c,k)=>{rr(x+5+k*10,y+T-28,8,12,2,c,INK,2);line([x+9+k*10,y+T-28,x+9+k*10+(k-1.5)*8,y+T-46-k*3],INK,2.5)});
   const f=Math.sin(t*.3)*3;ctx.fillStyle='#e8322b';ctx.beginPath();ctx.moveTo(x+14,y+T-16);ctx.quadraticCurveTo(x+24,y+T-44-f,x+34,y+T-16);ctx.fill();
   ctx.fillStyle='#ffd400';ctx.beginPath();ctx.moveTo(x+19,y+T-16);ctx.quadraticCurveTo(x+24,y+T-32-f,x+29,y+T-16);ctx.fill();
  }else if(h.t==='O'){
   const sh=ph===1?Math.sin(t*1.6)*2:0;
   rr(x+6+sh,y+T-30,T-12,28,8,'#9aa3b5');rr(x+14+sh,y+T-34,8,6,1,INK,null);rr(x+T-22+sh,y+T-34,8,6,1,INK,null);rr(x+T-8+sh,y+T-22,6,6,1,INK,null);
   if(ph===1){ctx.fillStyle='rgba(90,95,138,.5)';for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(x+16+k*8,y+T-40-((t+k*8)%30),6,0,7);ctx.fill()}}
   if(ph===2){for(let k=0;k<5;k++)spark(x+T/2+Math.sin(t*.5+k)*8,y+T-40-k*26-((t*3)%26),.8)}
  }else if(h.t==='Y'){
   const sw=Math.sin(t*.06)*4,yy=h.top+60;
   line([x+T/2,h.top,x+T/2+sw,yy],INK,3);
   ctx.save();ctx.translate(x+T/2+sw,yy);ctx.rotate(Math.sin(t*.06)*.2);
   rr(-16,0,32,20,8,'#e8322b');rr(-6,18,12,16,2,'#e8322b');rr(14,4,8,12,2,INK,null);ctx.restore();
   spark(x+T/2,yy-4,.6);
   ctx.fillStyle='#4fb3e8';ctx.beginPath();ctx.ellipse(x+T/2,GROUND-6,T/2,8,0,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  }else if(h.t==='H'){
   rr(x+4,y+30,T-8,2*T-30,0,null);
   ctx.beginPath();ctx.moveTo(x+T/2,y+2);ctx.lineTo(x+T-2,y+44);ctx.lineTo(x+2,y+44);ctx.closePath();ctx.fillStyle='#ffd400';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
   bolt(x+T/2,y+30,.6,INK);
  }
 }

 function drawBoss(){if(boss.kind==='sobre')drawSobre();else if(boss.kind==='nube')drawNube();else drawCometa()}
 function drawCometa(){
  const b=boss,ph=bossPhase(),dead=b.dead,x=b.x,y=b.y;
  const tailFlash=!dead&&b.att&&b.att.type==='tail'&&b.att.t<36&&t%8<4;

  ctx.setLineDash([4,4]);line([x,y-60,x+Math.sin(t*.05)*20,40,x-40,22],'rgba(19,32,63,.6)',2);ctx.setLineDash([]);

   ctx.beginPath();ctx.moveTo(tx-9,ty-6);ctx.lineTo(tx+9,ty+6);ctx.lineTo(tx+9,ty-6);ctx.lineTo(tx-9,ty+6);ctx.closePath();ctx.fill();ctx.lineWidth=2;ctx.stroke()}
  /* cuerpo de rombo */
  ctx.save();ctx.translate(x,y);ctx.rotate(dead?b.deadT*.1:Math.sin(t*.05)*.12);
  const pts=[[0,-64],[56,-6],[0,62],[-56,-6]];
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  ctx.fillStyle=dead?'#c9ccd6':'#e8322b';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();
  if(!dead){ctx.beginPath();ctx.moveTo(0,-64);ctx.lineTo(56,-6);ctx.lineTo(0,-6);ctx.closePath();ctx.fillStyle='#ffd400';ctx.fill();
   ctx.beginPath();ctx.moveTo(0,62);ctx.lineTo(-56,-6);ctx.lineTo(0,-6);ctx.closePath();ctx.fillStyle='#ffd400';ctx.fill()}
  line([0,-64,0,62],INK,3);line([-56,-6,56,-6],INK,3);
  if(b.hurtT>0){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill()}
  /* corona */
  if(!dead){ctx.beginPath();ctx.moveTo(-22,-56);ctx.lineTo(-22,-80);ctx.lineTo(-11,-68);ctx.lineTo(0,-86);ctx.lineTo(11,-68);ctx.lineTo(22,-80);ctx.lineTo(22,-56);ctx.closePath();ctx.fillStyle='#ffd400';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke()}
